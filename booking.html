<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Бронирование - CulTravel</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <div class="logo">CulTravel</div>
        <nav>
            <ul>
                <li><a href="index.html">Главная</a></li>
                <li><a href="tours.html">Туры</a></li>
                <li><a href="gallery.html">Галерея</a></li>
                <li><a href="contact.html">Контакты</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <h2>Забронируйте свой музейный тур</h2>

        <form id="booking-form">
            <label for="name">Имя:</label>
            <input type="text" id="name" name="name" required>

            <label for="tour">Выберите тур:</label>
            <select id="tour" name="tour" required>
                <option value="history">Исторический музей</option>
                <option value="art">Музей искусства</option>
                <option value="science">Научный музей</option>
            </select>

            <label for="date">Дата тура:</label>
            <input type="date" id="date" name="date" required>

            <label for="people">Количество человек:</label>
            <input type="number" id="people" name="people" min="1" required>

            <button type="submit">Подтвердить бронирование</button>
        </form>
    </main>

    <footer>
        <p>&copy; 2025 CulTravel. Все права защищены.</p>
    </footer>

    <script src="booking.js"></script>
</body>
</html>
